apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-event-portal.fullname" . }}-backend
  labels: { app: backend }
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: {{ include "smart-event-portal.fullname" . }}-config }
            - secretRef:    { name: {{ include "smart-event-portal.fullname" . }}-secrets }
          readinessProbe:
            httpGet: { path: /api/ready, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: {{ .Values.service.type }}
  selector: { app: backend }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
      name: http
