name: Notify Jenkins
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Jenkins build webhook
        run: |
          if [ -z "$JENKINS_WEBHOOK_URL" ]; then
            echo "JENKINS_WEBHOOK_URL not set; skipping."; exit 0
          fi
          curl -fsS -X POST "$JENKINS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","branch":"${{ github.ref_name }}","commit":"${{ github.sha }}"}'
