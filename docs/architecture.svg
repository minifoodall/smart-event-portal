<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Segoe UI, Arial" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Smart Event Portal — CI/CD Architecture</text>

  <!-- GitHub -->
  <rect x="60" y="80" width="180" height="60" rx="8" fill="#111827"/>
  <text x="150" y="105" text-anchor="middle" fill="white" font-weight="700">GitHub Repo</text>
  <text x="150" y="125" text-anchor="middle" fill="#9ca3af" font-size="12">source of truth</text>

  <!-- GitHub Actions -->
  <rect x="60" y="180" width="180" height="60" rx="8" fill="#0f172a"/>
  <text x="150" y="205" text-anchor="middle" fill="white" font-weight="700">GitHub Actions</text>
  <text x="150" y="225" text-anchor="middle" fill="#9ca3af" font-size="12">notify jenkins</text>

  <!-- Jenkins -->
  <rect x="300" y="180" width="220" height="180" rx="8" fill="#1d4ed8"/>
  <text x="410" y="205" text-anchor="middle" fill="white" font-weight="700">Jenkins</text>
  <text x="410" y="232" text-anchor="middle" fill="#cbd5e1" font-size="12">Checkout → Test → Build</text>
  <text x="410" y="252" text-anchor="middle" fill="#cbd5e1" font-size="12">Trivy → Push → Deploy</text>
  <text x="410" y="272" text-anchor="middle" fill="#cbd5e1" font-size="12">Verify (auto-rollback)</text>
  <text x="410" y="332" text-anchor="middle" fill="#bfdbfe" font-size="11">Slack notif. on success/fail</text>

  <!-- Docker Hub -->
  <rect x="60" y="430" width="180" height="60" rx="8" fill="#0e7490"/>
  <text x="150" y="455" text-anchor="middle" fill="white" font-weight="700">Docker Hub</text>
  <text x="150" y="475" text-anchor="middle" fill="#a5f3fc" font-size="12">image registry</text>

  <!-- Kubernetes -->
  <rect x="560" y="100" width="380" height="540" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-dasharray="6 4"/>
  <text x="750" y="125" text-anchor="middle" fill="#155e75" font-weight="700">Kubernetes Cluster</text>

  <!-- Frontend -->
  <rect x="600" y="150" width="140" height="80" rx="8" fill="#2563eb"/>
  <text x="670" y="180" text-anchor="middle" fill="white" font-weight="700">Frontend</text>
  <text x="670" y="200" text-anchor="middle" fill="#bfdbfe" font-size="12">Nginx + React</text>
  <text x="670" y="216" text-anchor="middle" fill="#bfdbfe" font-size="11">2 replicas</text>

  <!-- Backend -->
  <rect x="780" y="150" width="140" height="80" rx="8" fill="#16a34a"/>
  <text x="850" y="180" text-anchor="middle" fill="white" font-weight="700">Backend</text>
  <text x="850" y="200" text-anchor="middle" fill="#bbf7d0" font-size="12">Node.js API</text>
  <text x="850" y="216" text-anchor="middle" fill="#bbf7d0" font-size="11">2-5 replicas (HPA)</text>

  <!-- Mongo -->
  <rect x="690" y="290" width="140" height="70" rx="8" fill="#7c3aed"/>
  <text x="760" y="320" text-anchor="middle" fill="white" font-weight="700">MongoDB</text>
  <text x="760" y="338" text-anchor="middle" fill="#ddd6fe" font-size="12">StatefulSet + PVC</text>

  <!-- Canary -->
  <rect x="600" y="400" width="320" height="60" rx="8" fill="#f59e0b"/>
  <text x="760" y="425" text-anchor="middle" fill="white" font-weight="700">Canary (Istio VS/DR)</text>
  <text x="760" y="445" text-anchor="middle" fill="#fef3c7" font-size="12">90% stable • 10% canary</text>

  <!-- Monitoring -->
  <rect x="600" y="480" width="320" height="60" rx="8" fill="#dc2626"/>
  <text x="760" y="505" text-anchor="middle" fill="white" font-weight="700">Prometheus + Grafana</text>
  <text x="760" y="525" text-anchor="middle" fill="#fecaca" font-size="12">ServiceMonitor + alerts</text>

  <!-- Argo -->
  <rect x="600" y="560" width="320" height="60" rx="8" fill="#0891b2"/>
  <text x="760" y="585" text-anchor="middle" fill="white" font-weight="700">Argo CD (GitOps)</text>
  <text x="760" y="605" text-anchor="middle" fill="#cffafe" font-size="12">reconciles k8s/overlays</text>

  <!-- Arrows -->
  <line x1="240" y1="110" x2="300" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="210" x2="300" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="360" x2="150" y2="430" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="200" x2="780" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="240" x2="760" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="230" x2="850" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="660" x2="200" y2="110" stroke="#6b7280" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="430" y="640" fill="#6b7280" font-size="11">GitOps pull loop</text>
</svg>
