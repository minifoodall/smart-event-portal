apiVersion: v1
kind: Secret
metadata:
  name: event-portal-secrets
  namespace: event-portal
type: Opaque
stringData:
  # Overwrite these in production with: kubectl -n event-portal create secret generic event-portal-secrets --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
  JWT_SECRET: "change-me-in-production-please-rotate"
  MONGO_ROOT_PASSWORD: "change-me-mongo"
  DOCKERHUB_USERNAME: "gunjk"
  # DOCKERHUB_TOKEN is provided via Jenkins credentials, not stored in the cluster
