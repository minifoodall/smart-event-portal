# Ingress routes external traffic to the frontend service and forwards /api to the backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-portal
  namespace: event-portal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
