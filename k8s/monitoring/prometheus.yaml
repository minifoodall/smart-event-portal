# ServiceMonitor for Prometheus Operator (kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: event-portal-backend
  namespace: event-portal
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames: [event-portal]
  endpoints:
    - port: http
      path: /api/health
      interval: 15s
---
# PrometheusRule alerting on pod restarts and high error rate
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-portal-alerts
  namespace: event-portal
  labels:
    release: prometheus
spec:
  groups:
    - name: event-portal
      rules:
        - alert: BackendPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="event-portal"}[10m]) > 3
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "Backend pod restarting frequently"
        - alert: High5xxRate
          expr: sum(rate(nginx_ingress_response_status_total{namespace="event-portal",status=~"5.."}[5m])) > 0.1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "5xx error rate elevated"
